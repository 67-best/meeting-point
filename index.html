<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Best Meeting Point</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
rel="stylesheet">

<style>

body{
margin:0;
font-family:Inter;
background:#0f172a;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.app{
width:900px;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:20px;
}

button{
padding:12px;
border-radius:10px;
border:none;
background:#6366f1;
color:white;
cursor:pointer;
margin-top:10px;
}

input{
padding:12px;
border-radius:10px;
border:none;
width:300px;
margin-top:10px;
}

#map{
height:400px;
margin-top:20px;
border-radius:15px;
}

</style>

</head>
<body>

<div class="app">

<h2>Best Meeting Point</h2>

<div id="roomLink"></div>

<button onclick="addLocationGPS()">
Use my GPS location
</button>

<br>

<input id="addressInput"
placeholder="Enter address manually"/>

<button onclick="addManualAddress()">
Use address
</button>

<div id="status"></div>

<div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSy...",
authDomain:"meeting-point-c6e59.firebaseapp.com",
projectId:"meeting-point-c6e59"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* USER ID */

let userId=localStorage.getItem("userId");

if(!userId){

userId=Math.random().toString(36).substring(2,10);
localStorage.setItem("userId",userId);

}


/* ROOM */

let roomId=
new URLSearchParams(window.location.search).get("room");

if(!roomId){

roomId=Math.random().toString(36).substring(2,8);
window.location.search="?room="+roomId;

}

document.getElementById("roomLink").innerHTML=
window.location.href;


/* MAP */

const map=L.map("map").setView([40,-3],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

let markers=[];

function clearMarkers(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

}


/* GPS LOCATION */

window.addLocationGPS=function(){

navigator.geolocation.getCurrentPosition(

pos=>{

saveLocation(
pos.coords.latitude,
pos.coords.longitude
);

},

()=>{

alert("GPS denied. Enter address manually.");

}

);

}


/* MANUAL ADDRESS */

window.addManualAddress=async function(){

const address=
document.getElementById("addressInput").value;

const url=
"https://nominatim.openstreetmap.org/search?format=json&q="
+encodeURIComponent(address);

const res=await fetch(url);

const data=await res.json();

if(data.length==0){

alert("Address not found");
return;

}

saveLocation(
parseFloat(data[0].lat),
parseFloat(data[0].lon)
);

}


/* SAVE LOCATION */

async function saveLocation(lat,lng){

const ref=doc(db,"rooms",roomId);

const snap=await getDoc(ref);

let locations={};

if(snap.exists())
locations=snap.data().locations||{};


/* CLEAN OLD USERS */

const now=Date.now();

Object.keys(locations).forEach(id=>{

if(now-locations[id].lastSeen>1000*60*5){

delete locations[id];

}

});


locations[userId]={

lat,
lng,
lastSeen:Date.now()

};

await setDoc(ref,{locations});

}


/* REALTIME */

onSnapshot(
doc(db,"rooms",roomId),
snap=>{

if(!snap.exists())return;

updateMap(
snap.data().locations||{}
);

});


/* UPDATE MAP */

function updateMap(locations){

clearMarkers();

const users=
Object.values(locations);

let lat=0,lng=0;

users.forEach(u=>{

lat+=u.lat;
lng+=u.lng;

markers.push(
L.marker([u.lat,u.lng])
.addTo(map)
);

});

lat/=users.length;
lng/=users.length;

markers.push(
L.marker([lat,lng])
.addTo(map)
);

map.setView([lat,lng],10);

document.getElementById("status").innerHTML=
"Participants: "+users.length;

}

</script>

</body>
</html>
