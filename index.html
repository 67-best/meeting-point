<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Best Meeting Point</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

/* BACKGROUND */

body{

margin:0;

font-family:Inter;

background:
linear-gradient(180deg,#0f172a,#1e293b);

color:white;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}


/* APP CARD */

.app{

width:900px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(20px);

padding:25px;

border-radius:20px;

box-shadow:
0 30px 80px rgba(0,0,0,0.6);

}


/* TITLE */

.title{

font-size:28px;

font-weight:700;

margin-bottom:15px;

}


/* BUTTON */

button{

background:#6366f1;

border:none;

padding:12px 18px;

border-radius:10px;

color:white;

font-weight:600;

cursor:pointer;

margin-top:10px;

}

button:hover{

background:#7c3aed;

}


/* INPUT */

input{

padding:12px;

border-radius:10px;

border:none;

width:100%;

margin-top:10px;

}


/* AUTOCOMPLETE BOX */

.results{

background:#1e293b;

border-radius:10px;

margin-top:5px;

max-height:200px;

overflow:auto;

}

.result{

padding:10px;

cursor:pointer;

}

.result:hover{

background:#334155;

}


/* MAP */

#map{

height:400px;

margin-top:20px;

border-radius:15px;

}

</style>

</head>

<body>

<div class="app">

<div class="title">
Best Meeting Point
</div>

<div id="roomLink"></div>

<button onclick="useGPS()">
Use my location
</button>

<input id="search"
placeholder="Search address"/>

<div id="results" class="results"></div>

<div id="status"></div>

<div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


const firebaseConfig={

apiKey:"AIzaSy...",
authDomain:"meeting-point-c6e59.firebaseapp.com",
projectId:"meeting-point-c6e59"

};

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);


/* USER */

let userId=
localStorage.getItem("userId");

if(!userId){

userId=
Math.random().toString(36).substring(2,10);

localStorage.setItem("userId",userId);

}


/* ROOM */

let roomId=
new URLSearchParams(location.search)
.get("room");

if(!roomId){

roomId=
Math.random().toString(36).substring(2,8);

location.search="?room="+roomId;

}

document.getElementById("roomLink").innerHTML=
location.href;


/* MAP */

const map=L.map("map")
.setView([40,-3],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

let markers=[];

function clearMarkers(){

markers.forEach(m=>map.removeLayer(m));

markers=[];

}


/* SAVE LOCATION */

async function saveLocation(lat,lng){

const ref=
doc(db,"rooms",roomId);

const snap=
await getDoc(ref);

let locations={};

if(snap.exists())
locations=snap.data().locations||{};

locations[userId]={

lat,
lng,
time:Date.now()

};

await setDoc(ref,{locations});

}


/* GPS */

window.useGPS=function(){

navigator.geolocation.getCurrentPosition(

pos=>{

saveLocation(
pos.coords.latitude,
pos.coords.longitude
);

},

()=>alert("GPS denied")

);

}


/* AUTOCOMPLETE */

const search=
document.getElementById("search");

search.oninput=async ()=>{

const q=search.value;

if(q.length<3)return;

const url=
"https://photon.komoot.io/api/?q="
+encodeURIComponent(q);

const res=await fetch(url);

const data=await res.json();

const results=
document.getElementById("results");

results.innerHTML="";

data.features.forEach(place=>{

const div=
document.createElement("div");

div.className="result";

div.innerHTML=
place.properties.name+", "+
(place.properties.city||"");

div.onclick=()=>{

saveLocation(
place.geometry.coordinates[1],
place.geometry.coordinates[0]
);

results.innerHTML="";

};

results.appendChild(div);

});

};


/* REALTIME */

onSnapshot(
doc(db,"rooms",roomId),
snap=>{

if(!snap.exists())return;

updateMap(
snap.data().locations||{}
);

});


/* UPDATE MAP */

function updateMap(locations){

clearMarkers();

const users=
Object.values(locations);

let lat=0,lng=0;

users.forEach(u=>{

lat+=u.lat;
lng+=u.lng;

markers.push(
L.marker([u.lat,u.lng])
.addTo(map)
);

});

lat/=users.length;
lng/=users.length;

markers.push(
L.marker([lat,lng])
.addTo(map)
.bindPopup("Meeting Point")
.openPopup()
);

map.setView([lat,lng],10);

document.getElementById("status").innerHTML=
"Participants: "+users.length;

}

</script>

</body>
</html>
