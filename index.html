<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Best Meeting Point</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
rel="stylesheet">

<style>

/* -----------------------------
   GLOBAL
------------------------------ */

body {

  margin: 0;

  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

  background:
  linear-gradient(180deg,#f5f7fb 0%,#e9eef5 100%);

  height: 100vh;

  display: flex;

  justify-content: center;

  align-items: center;

}


/* -----------------------------
   CONTAINER
------------------------------ */

.container {

  width: 900px;

}


/* -----------------------------
   TITLE
------------------------------ */

.title {

  font-size: 28px;

  font-weight: 600;

  color: #111;

  margin-bottom: 20px;

}


/* -----------------------------
   CARD (Glass effect)
------------------------------ */

.card {

  background: rgba(255,255,255,0.7);

  backdrop-filter: blur(20px);

  border-radius: 20px;

  padding: 24px;

  box-shadow:
  0 10px 30px rgba(0,0,0,0.08);

}


/* -----------------------------
   TEXT
------------------------------ */

#roomLink {

  font-size: 14px;

  color: #555;

  margin-bottom: 16px;

  word-break: break-all;

}

#status {

  margin-top: 16px;

  font-size: 15px;

  color: #333;

}


/* -----------------------------
   BUTTON
------------------------------ */

button {

  background: #111;

  color: white;

  border: none;

  padding: 12px 20px;

  border-radius: 12px;

  font-size: 15px;

  font-weight: 500;

  cursor: pointer;

  transition: all 0.2s ease;

}

button:hover {

  transform: translateY(-1px);

  box-shadow:
  0 5px 15px rgba(0,0,0,0.15);

}


/* -----------------------------
   MAP
------------------------------ */

#map {

  height: 420px;

  margin-top: 20px;

  border-radius: 16px;

  overflow: hidden;

}

</style>

</head>

<body>

<div class="container">

<div class="title">
Best Meeting Point
</div>

<div class="card">

<p id="roomLink"></p>

<button id="locationBtn">
Add My Location
</button>

<div id="status">
Waiting for participants...
</div>

<div id="map"></div>

</div>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

/* -----------------------------
   FIREBASE
------------------------------ */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyCS7M73mjrroopukLHjnsYU_LJsJd5sRhM",

  authDomain: "meeting-point-c6e59.firebaseapp.com",

  projectId: "meeting-point-c6e59",

  storageBucket: "meeting-point-c6e59.firebasestorage.app",

  messagingSenderId: "461316484285",

  appId: "1:461316484285:web:d479f85ae597f32bd59bd4"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* -----------------------------
   USER ID (prevents duplicates)
------------------------------ */

let userId =
localStorage.getItem("userId");

if (!userId) {

  userId =
  Math.random().toString(36).substring(2,10);

  localStorage.setItem("userId",userId);

}


/* -----------------------------
   ROOM SYSTEM
------------------------------ */

let roomId =
new URLSearchParams(window.location.search)
.get("room");

if (!roomId) {

  roomId =
  Math.random().toString(36).substring(2,8);

  window.location.search =
  "?room=" + roomId;

}

document.getElementById("roomLink").innerHTML =
"Share this link:<br>" +
window.location.href;


/* -----------------------------
   MAP INIT
------------------------------ */

const map =
L.map("map").setView([40.4168,-3.7038],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{ attribution: "© OpenStreetMap" }
).addTo(map);

let markers = [];

function clearMarkers(){

markers.forEach(marker =>
map.removeLayer(marker)
);

markers = [];

}


/* -----------------------------
   ADD LOCATION
------------------------------ */

document.getElementById("locationBtn")
.addEventListener("click",()=>{

if (!navigator.geolocation){

alert("Geolocation not supported");

return;

}

navigator.geolocation.getCurrentPosition(

async position=>{

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

const roomRef =
doc(db,"rooms",roomId);

const snapshot =
await getDoc(roomRef);

let locations = {};

if(snapshot.exists()){

locations =
snapshot.data().locations || {};

}

locations[userId] =
{lat,lng};

await setDoc(roomRef,
{locations});

},

error=>{

alert("Location permission denied");

}

);

});


/* -----------------------------
   REALTIME SYNC
------------------------------ */

onSnapshot(

doc(db,"rooms",roomId),

snapshot=>{

if(!snapshot.exists()) return;

const locations =
snapshot.data().locations || {};

updateMap(locations);

}

);


/* -----------------------------
   UPDATE MAP + MIDPOINT
------------------------------ */

function updateMap(locationsObj){

clearMarkers();

const locations =
Object.values(locationsObj);

if(locations.length===0) return;

let totalLat=0;
let totalLng=0;

locations.forEach(loc=>{

totalLat+=loc.lat;
totalLng+=loc.lng;

const marker=
L.marker([loc.lat,loc.lng])
.addTo(map);

markers.push(marker);

});

const centerLat=
totalLat/locations.length;

const centerLng=
totalLng/locations.length;

const centerMarker=
L.marker([centerLat,centerLng])
.addTo(map)
.bindPopup("Meeting Point")
.openPopup();

markers.push(centerMarker);

map.setView(
[centerLat,centerLng],
10
);

document.getElementById("status")
.innerHTML=
"Participants: "+locations.length;

}

</script>

</body>
</html>
