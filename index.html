<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Best Meeting Point</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body {

  font-family: Arial;

  background: linear-gradient(135deg,#667eea,#764ba2);

  color: white;

  text-align: center;

  padding: 20px;

}

.card {

  background: white;

  color: black;

  padding: 20px;

  border-radius: 12px;

  max-width: 800px;

  margin: auto;

}

button {

  padding: 12px;

  border-radius: 8px;

  border: none;

  background: #667eea;

  color: white;

  cursor: pointer;

  font-size: 16px;

}

button:hover {

  background: #5a67d8;

}

#map {

  height: 400px;

  margin-top: 20px;

  border-radius: 12px;

}

#roomLink {

  word-break: break-all;

}

</style>

</head>
<body>

<h1>Best Meeting Point</h1>

<div class="card">

<p id="roomLink"></p>

<button onclick="addMyLocation()">

Add My Location

</button>

<p id="result">

Waiting for participants...

</p>

<div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";


import {

  getFirestore,

  doc,

  setDoc,

  getDoc,

  onSnapshot

}

from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";



const firebaseConfig = {

  apiKey: "AIzaSyCS7M73mjrroopukLHjnsYU_LJsJd5sRhM",

  authDomain: "meeting-point-c6e59.firebaseapp.com",

  projectId: "meeting-point-c6e59",

  storageBucket: "meeting-point-c6e59.firebasestorage.app",

  messagingSenderId: "461316484285",

  appId: "1:461316484285:web:d479f85ae597f32bd59bd4",

  measurementId: "G-29RJRWD4NH"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



let roomId =

new URLSearchParams(window.location.search)

.get("room");


if (!roomId) {

  roomId =

  Math.random().toString(36).substring(2,8);

  window.location.search =

  "?room=" + roomId;

}


document.getElementById("roomLink")

.innerHTML =

"Share this link:<br>" +

window.location.href;



let map =

L.map("map").setView([40.4168,-3.7038],6);


L.tileLayer(

"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"

).addTo(map);



let markers = [];


function clearMarkers() {

  markers.forEach(marker =>

    map.removeLayer(marker)

  );

  markers = [];

}



async function addMyLocation() {


navigator.geolocation.getCurrentPosition(


async position => {


let lat = position.coords.latitude;

let lng = position.coords.longitude;


let roomRef =

doc(db,"rooms",roomId);


let roomSnapshot =

await getDoc(roomRef);


let locations = [];


if (roomSnapshot.exists()) {

locations =

roomSnapshot.data().locations || [];

}


locations.push({

lat: lat,

lng: lng

});


await setDoc(roomRef, {

locations: locations

});


});


}



onSnapshot(

doc(db,"rooms",roomId),

(snapshot) => {


if (!snapshot.exists()) return;


let locations =

snapshot.data().locations;


calculateMeetingPoint(locations);


}

);



function calculateMeetingPoint(locations) {


clearMarkers();


let totalLat = 0;

let totalLng = 0;


locations.forEach(location => {


totalLat += location.lat;

totalLng += location.lng;


let marker =

L.marker([

location.lat,

location.lng

]).addTo(map);


markers.push(marker);


});


let centerLat =

totalLat / locations.length;


let centerLng =

totalLng / locations.length;


let meetingMarker =

L.marker([

centerLat,

centerLng

])

.addTo(map)

.bindPopup("Meeting Point")

.openPopup();


markers.push(meetingMarker);


map.setView([

centerLat,

centerLng

],7);


document.getElementById("result")

.innerHTML =

"Participants: " +

locations.length;


}


</script>


</body>

</html>
