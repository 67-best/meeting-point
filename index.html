<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>Best Meeting Point</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
rel="stylesheet">

<style>

/* BACKGROUND */

body {

margin:0;
font-family:'Inter',sans-serif;

background:
radial-gradient(circle at 20% 20%,#6366f1 0%,transparent 40%),
radial-gradient(circle at 80% 80%,#8b5cf6 0%,transparent 40%),
#0f172a;

height:100vh;

display:flex;
justify-content:center;
align-items:center;

animation:bgMove 20s infinite alternate;

}

@keyframes bgMove{

0%{background-position:0% 0%;}
100%{background-position:100% 100%;}

}


/* MAIN CARD */

.app{

width:900px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(30px);

border-radius:24px;

padding:24px;

box-shadow:
0 30px 80px rgba(0,0,0,0.6);

border:1px solid rgba(255,255,255,0.1);

color:white;

animation:fadeIn 1s ease;

}

@keyframes fadeIn{

from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}

}


/* TITLE */

.title{

font-size:32px;
font-weight:700;
margin-bottom:16px;

}


/* LINK BOX */

.linkBox{

background:rgba(255,255,255,0.05);

padding:12px;

border-radius:12px;

margin-bottom:16px;

font-size:14px;

color:#cbd5e1;

}


/* BUTTON */

button{

background:linear-gradient(135deg,#6366f1,#8b5cf6);

border:none;

padding:14px 22px;

border-radius:14px;

font-size:16px;

font-weight:600;

color:white;

cursor:pointer;

transition:0.2s;

}

button:hover{

transform:scale(1.08);

box-shadow:
0 10px 40px rgba(139,92,246,0.6);

}


/* STATUS */

#status{

margin-top:16px;
margin-bottom:16px;

color:#e2e8f0;

}


/* MAP */

#map{

height:420px;

border-radius:16px;

overflow:hidden;

border:1px solid rgba(255,255,255,0.2);

}


/* MARKER */

.user-marker{

width:18px;
height:18px;

background:#6366f1;

border-radius:50%;

border:3px solid white;

box-shadow:
0 0 20px rgba(99,102,241,0.8);

}

.midpoint-marker{

width:22px;
height:22px;

background:#22c55e;

border-radius:50%;

border:4px solid white;

box-shadow:
0 0 30px rgba(34,197,94,0.9);

animation:pulse 2s infinite;

}

@keyframes pulse{

0%{transform:scale(1);}
50%{transform:scale(1.2);}
100%{transform:scale(1);}

}

</style>

</head>

<body>

<div class="app">

<div class="title">
Best Meeting Point
</div>

<div id="roomLink" class="linkBox">
Loading...
</div>

<button id="locationBtn">
Add My Location
</button>

<div id="status">
Waiting for participants...
</div>

<div id="map"></div>

</div>


<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
setDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";


const firebaseConfig={
apiKey:"AIzaSyCS7M73mjrroopukLHjnsYU_LJsJd5sRhM",
authDomain:"meeting-point-c6e59.firebaseapp.com",
projectId:"meeting-point-c6e59",
storageBucket:"meeting-point-c6e59.firebasestorage.app",
messagingSenderId:"461316484285",
appId:"1:461316484285:web:d479f85ae597f32bd59bd4"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


/* USER ID */

let userId=localStorage.getItem("userId");

if(!userId){

userId=Math.random().toString(36).substring(2,10);
localStorage.setItem("userId",userId);

}


/* ROOM */

let roomId=
new URLSearchParams(window.location.search).get("room");

if(!roomId){

roomId=Math.random().toString(36).substring(2,8);
window.location.search="?room="+roomId;

}

document.getElementById("roomLink").innerHTML=
"Share this link:<br>"+window.location.href;


/* MAP */

const map=L.map("map").setView([40.4168,-3.7038],6);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
).addTo(map);

let markers=[];

function clearMarkers(){

markers.forEach(m=>map.removeLayer(m));
markers=[];

}


/* BUTTON */

document.getElementById("locationBtn").onclick=()=>{

navigator.geolocation.getCurrentPosition(

async pos=>{

const lat=pos.coords.latitude;
const lng=pos.coords.longitude;

const ref=doc(db,"rooms",roomId);

const snap=await getDoc(ref);

let locations={};

if(snap.exists())
locations=snap.data().locations||{};

locations[userId]={lat,lng};

await setDoc(ref,{locations});

}

);

};


/* REALTIME */

onSnapshot(doc(db,"rooms",roomId),snap=>{

if(!snap.exists())return;

updateMap(snap.data().locations||{});

});


/* UPDATE MAP */

function updateMap(obj){

clearMarkers();

const locs=Object.values(obj);

if(locs.length==0)return;

let lat=0,lng=0;

locs.forEach(l=>{

lat+=l.lat;
lng+=l.lng;

const icon=L.divIcon({
className:"user-marker"
});

markers.push(
L.marker([l.lat,l.lng],{icon})
.addTo(map)
);

});

lat/=locs.length;
lng/=locs.length;

const icon=L.divIcon({
className:"midpoint-marker"
});

markers.push(
L.marker([lat,lng],{icon})
.addTo(map)
);

map.setView([lat,lng],10);

document.getElementById("status").innerHTML=
"Participants: "+locs.length;

}

</script>

</body>
</html>
