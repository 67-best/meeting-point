<!DOCTYPE html>
<html>
<head>
  <title>Best Meeting Point Calculator</title>
  <meta charset="UTF-8">

  <!-- Leaflet map library -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      margin-top: 30px;
      background-color: #f4f4f4;
    }

    textarea {
      width: 400px;
      height: 120px;
      padding: 10px;
      font-size: 14px;
    }

    button {
      padding: 12px 25px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 5px;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }

    #map {
      height: 400px;
      width: 80%;
      margin: 20px auto;
      border-radius: 10px;
    }

  </style>
</head>
<body>

<h1>Best Meeting Point Calculator</h1>

<p>Enter addresses (one per line)</p>

<textarea id="addresses" placeholder="Example:
Zaragoza, Spain
Barcelona, Spain
Madrid, Spain"></textarea>

<br>

<button onclick="findMeetingPoint()">Calculate</button>

<div id="result"></div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([40.4168, -3.7038], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

let markers = [];

async function geocode(address) {

  let url = "https://nominatim.openstreetmap.org/search?format=json&q=" 
            + encodeURIComponent(address);

  let response = await fetch(url);
  let data = await response.json();

  if (data.length === 0) return null;

  return {
    lat: parseFloat(data[0].lat),
    lng: parseFloat(data[0].lon)
  };
}

async function findMeetingPoint() {

  let lines = document.getElementById("addresses").value.split("\n");

  let coords = [];

  document.getElementById("result").innerHTML = "Calculating...";

  // remove old markers
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  for (let line of lines) {

    if (line.trim() === "") continue;

    let coord = await geocode(line);

    if (coord) {

      coords.push(coord);

      let marker = L.marker([coord.lat, coord.lng])
        .addTo(map)
        .bindPopup("Person location");

      markers.push(marker);
    }
  }

  if (coords.length === 0) {

    document.getElementById("result").innerHTML = "No valid addresses";
    return;
  }

  let totalLat = 0;
  let totalLng = 0;

  for (let c of coords) {

    totalLat += c.lat;
    totalLng += c.lng;
  }

  let center = {

    lat: totalLat / coords.length,
    lng: totalLng / coords.length
  };

  // meeting point marker
  let meetingMarker = L.marker([center.lat, center.lng])
    .addTo(map)
    .bindPopup("Best Meeting Point")
    .openPopup();

  markers.push(meetingMarker);

  map.setView([center.lat, center.lng], 7);

  document.getElementById("result").innerHTML =
    "Best meeting point:<br>" +
    center.lat.toFixed(5) + ", " +
    center.lng.toFixed(5);

}

</script>

</body>
</html>
